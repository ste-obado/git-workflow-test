name: pyhton-workflow

on:
 push:
   branches:
        - main

jobs:
  tests:
     runs-on: ubuntu-latest
     
     steps:
       - name: checkout repo
         use: actions/checkout@v7
         with:
            python-version:  '3.12'
      
      - name: intsall dependencies
        run:  pip install -r requirements.txt

      - name: run the tests
        run: pytest -v
